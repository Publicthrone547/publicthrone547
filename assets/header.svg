<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">OmarX — full-stack engineer</title>
  <desc id="desc">Backends, bots and the apps on top of them.</desc>

  <style>
    :root {
      --bg: #010409;
      --border: #30363d;
      --orbit: #3d444d;
      --fg: #f0f6fc;
      --muted: #9198a1;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --border: #d1d9e0;
        --orbit: #c2cad3;
        --fg: #1f2328;
        --muted: #59636e;
      }
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .card { fill: var(--bg); stroke: var(--border); }
    .fg { fill: var(--fg); }
    .muted { fill: var(--muted); }
    .orbit { fill: none; stroke: var(--orbit); stroke-width: 1.25; }
    .transfer { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 1 8; stroke-linecap: round; }
  </style>

  <rect class="card" x="0.5" y="0.5" width="999" height="299" rx="18"/>

  <text class="mono muted" x="56" y="82" font-size="15" letter-spacing="3">FULL-STACK ENGINEER</text>
  <text class="sans fg" x="51" y="182" font-size="112" font-weight="800" letter-spacing="-4">OmarX</text>
  <text class="sans muted" x="56" y="234" font-size="23">Backends, bots and the apps on top of them.</text>

  <g class="muted">
    <circle cx="646" cy="70" r="1.2" opacity="0.7"/>
    <circle cx="936" cy="52" r="1" opacity="0.5"/>
    <circle cx="962" cy="216" r="1.3" opacity="0.7"/>
    <circle cx="690" cy="246" r="1" opacity="0.5"/>
    <circle cx="872" cy="262" r="1.1" opacity="0.6"/>
    <circle cx="760" cy="40" r="1" opacity="0.5"/>
  </g>

  <!-- Three circular orbits seen at an angle; periods follow Kepler's third law (T ∝ r^1.5). -->
  <g transform="translate(800 150) rotate(-16)">
    <path id="o1" class="orbit" d="M -60 0 a 60 25.2 0 1 0 120 0 a 60 25.2 0 1 0 -120 0"/>
    <path id="o2" class="orbit" d="M -105 0 a 105 44.1 0 1 0 210 0 a 105 44.1 0 1 0 -210 0"/>
    <path id="o3" class="orbit" d="M -150 0 a 150 63 0 1 0 300 0 a 150 63 0 1 0 -300 0"/>

    <!-- Hohmann transfer from the inner orbit to the outer one. -->
    <path id="tr" class="transfer" d="M -60 0 A 105 39.8 0 0 0 150 0"/>

    <circle class="fg" r="17"/>

    <circle class="fg" r="3.5">
      <animateMotion dur="10s" begin="-2s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion>
    </circle>
    <circle class="fg" r="3.5">
      <animateMotion dur="23s" begin="-15s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion>
    </circle>
    <circle class="fg" r="3.5">
      <animateMotion dur="39.5s" begin="-9s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion>
    </circle>

    <circle class="fg" r="3">
      <animateMotion dur="14s" begin="-6s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.15 0.55 0.6 1"><mpath href="#tr"/></animateMotion>
      <animate attributeName="opacity" dur="14s" begin="-6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.9;1"/>
    </circle>
  </g>
</svg>
